<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>${title}</title>
<meta name="description" content="${description}">
<meta name="robots" content="${robots}">
<link rel="canonical" href="${canonical}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="${site_name}">
<meta property="og:title" content="${title}">
<meta property="og:description" content="${description}">
<meta property="og:url" content="${canonical}">
<meta property="og:image" content="${og_image}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="${og_image_alt}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101211" media="(prefers-color-scheme: dark)">
<link rel="icon" href="${root}favicon.ico" sizes="32x32">
<link rel="icon" href="${root}favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="${root}apple-touch-icon.png">
<link rel="stylesheet" href="${root}assets/site.css?v=${css_version}">
${head_extra}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
${banner}
<div class="page">
  <nav class="bar" aria-label="Site">
    <a class="bar-name" href="${home_link}">${galley}<span>${site_name}</span></a>
    <div class="bar-links">${nav_links}</div>
  </nav>
  <main class="main" id="main">
${content}
  </main>
  <footer class="foot">
    <span>© ${year} ${site_name}</span>
    <nav class="foot-links" aria-label="Legal">
      <a href="${privacy_link}">Privacy</a>
      <a href="${terms_link}">Terms</a>
    </nav>
  </footer>
</div>
</body>
</html>
